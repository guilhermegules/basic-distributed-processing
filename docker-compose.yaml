x-service-template: &service-template
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    - NODE_ENV=${NODE_ENV}
    - LOG_LEVEL=${LOG_LEVEL}
    - RABBITMQ_HOST=${RABBITMQ_HOST}
    - RABBITMQ_PORT=${RABBITMQ_PORT}
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
    - PORT=${PORT}
  volumes:
    - ./:/app
  depends_on:
    rabbitmq:
      condition: service_healthy
    mongo:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=collector
    command: ["mongod", "--quiet"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  producer1:
    <<: *service-template
    command: ["pnpm", "start", "--filter", "./services/producer"]
    container_name: producer1
    networks:
      - backend

  producer2:
    <<: *service-template
    command: ["pnpm", "start", "--filter", "./services/producer"]
    container_name: producer2
    networks:
      - backend

  worker:
    <<: *service-template
    command: ["pnpm", "start", "--filter", "./services/worker"]
    container_name: worker
    networks:
      - backend

  collector:
    <<: *service-template
    command: ["pnpm", "start", "--filter", "./services/collector"]
    container_name: collector
    environment:
      - NODE_ENV=${NODE_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MONGO_URI=${MONGO_URI}
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - producer1
      - producer2
    networks:
      - backend

volumes:
  mongo_data:

networks:
  backend:
    driver: bridge
