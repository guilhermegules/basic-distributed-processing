x-service-template: &service-template
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    - NODE_ENV=${NODE_ENV}
    - LOG_LEVEL=${LOG_LEVEL}
    - RABBITMQ_HOST=${RABBITMQ_HOST}
    - RABBITMQ_PORT=${RABBITMQ_PORT}
    - RABBITMQ_USER=${RABBITMQ_USER}
    - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
  volumes:
    - ./:/app
  depends_on:
    rabbitmq:
      condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  producer:
    <<: *service-template
    command: ["pnpm", "start", "--filter", "./services/producer"]
    container_name: producer
    ports:
      - ${PORT}:${PORT}
    environment:
      - NODE_ENV=${NODE_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      - PORT=${PORT}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}

  worker:
    <<: *service-template
    command: ["pnpm", "start", "--filter", "./services/worker"]
    container_name: worker

  collector:
    <<: *service-template
    command: ["pnpm", "start", "--filter", "./services/collector"]
    container_name: collector

  k6:
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: k6
    depends_on:
      - producer
      - worker
      - collector
    volumes:
      - ./data:/scripts/data
    ports:
      - 5665:5665
    working_dir: /scripts
    entrypoint: ["k6"]
    command: ["run", "--out", "dashboard=0.0.0.0:5665", "/scripts/load-test.js"]

volumes:
  grafana_data:
